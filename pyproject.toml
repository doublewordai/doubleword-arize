[project]
name = "doubleword-arize"
version = "0.1.0"
description = "Doubleword async agent PoC. Single Doubleword key, three inference tiers (realtime / async / batch), local Phoenix observability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "autobatcher>=0.1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "arize-phoenix>=5.0.0",
    "arize-phoenix-otel>=0.6.0",
    "openinference-instrumentation-openai>=0.1.18",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "pandas>=2.2",
    "python-dotenv>=1.0.1",
    "wasabi>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwp"]

[tool.uv]
# Generate a universal lockfile covering Linux, macOS, and Windows so
# `uv sync` resolves correctly on any platform without regenerating.
environments = [
    "python_version >= '3.11' and sys_platform == 'linux'",
    "python_version >= '3.11' and sys_platform == 'darwin'",
    "python_version >= '3.11' and sys_platform == 'win32'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
